name: PHP

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read # only needs to read the repository contents

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        php-version: [ '8.3', '8.4', '8.5' ]
        pg-version: [ '17' ]
        include:
          # Coverage report and mutation testing only need to run once.
          - php-version: '8.5'
            coverage: true

    services:
      postgres:
        # Pinned by digest to postgres:17; update the digest when bumping pg-version.
        image: postgres:${{ matrix.pg-version }}@sha256:2203e6282d9e7de7c24d7da234e2a744fb325df366a3fd8ed940e8abbee39527
        env:
          POSTGRES_PASSWORD: ${{ vars.PHPPGADMIN_TEST_SERVER_PASSWORD }}
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    name: PHP ${{ matrix.php-version }}

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: intl, pdo_pgsql, xdebug, zip
          coverage: xdebug
          ini-values: xdebug.mode=coverage,error_reporting=E_ALL,display_errors=On

      - run: composer validate --strict
      - run: composer install --prefer-dist --no-progress
      - run: composer run-script dev:lint:php
      - run: composer run-script dev:lint:phpcs
      - run: composer run-script "dev:analyze:phpstan-${PHP_VERSION}"
        env:
          PHP_VERSION: ${{ matrix.php-version }}
      - run: composer run-script dev:test
        if: ${{ !matrix.coverage }}
        env:
          PHPPGADMIN_TEST_SERVER_HOSTNAME: localhost
          PHPPGADMIN_TEST_SERVER_PASSWORD: ${{ vars.PHPPGADMIN_TEST_SERVER_PASSWORD }}
      - run: composer run-script dev:test:coverage:ci
        if: ${{ matrix.coverage }}
        env:
          PHPPGADMIN_TEST_SERVER_HOSTNAME: localhost
          PHPPGADMIN_TEST_SERVER_PASSWORD: ${{ vars.PHPPGADMIN_TEST_SERVER_PASSWORD }}
      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        if: ${{ matrix.coverage }}
        with:
          disable_search: true
          fail_ci_if_error: true
          files: coverage/clover.xml
          # Pull requests from forks get no secrets; Codecov accepts their uploads without a token.
          token: ${{ secrets.CODECOV_TOKEN }}
      - run: composer run-script dev:test:mutation
        if: ${{ matrix.coverage }}
        env:
          PHPPGADMIN_TEST_SERVER_HOSTNAME: localhost
          PHPPGADMIN_TEST_SERVER_PASSWORD: ${{ vars.PHPPGADMIN_TEST_SERVER_PASSWORD }}
          # Pull request builds do not send the report to the Stryker Dashboard (see infection.json5).
          STRYKER_DASHBOARD_API_KEY: ${{ github.event_name == 'push' && secrets.STRYKER_DASHBOARD_API_KEY || '' }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ matrix.coverage && !cancelled() }}
        with:
          name: infection-report
          path: infection/
          retention-days: 30
